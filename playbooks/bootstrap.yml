- name: Install Kubernetes components
  hosts: k8s_team
  become: true
  vars_files:
    - ../group_vars/all/vault.yml
  vars:
    kubernetes_version: "1.32"
    crio_version: "1.32"
  tasks:
    - name: Add Kubernetes repository and install kubeadm and kubectl
      ansible.builtin.include_role:
        name: kubeadm

    - name: Install CRI-O
      ansible.builtin.include_role:
        name: crio

    - name: Prepare system and install kubelet
      ansible.builtin.include_role:
        name: kubelet
