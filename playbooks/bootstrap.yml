- name: Install Kubernetes components
  hosts: k8s_team
  become: true
  vars_files:
    - ../group_vars/all/vault.yml
    - ../group_vars/all/main.yml
  vars:
    kubernetes_version: "1.32"
    crio_version: "1.32"
  tasks:
    - name: Remove conflicting repo files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/kubernetes.list
        - /etc/apt/sources.list.d/kubernetes.sources
        - /etc/apt/sources.list.d/cri-o.list
        - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - /etc/apt/keyrings/kubernetes.asc
        - /etc/apt/keyrings/crio-apt-keyring.gpg

    - name: Add local mirror repository
      ansible.builtin.deb822_repository:
        name: k8s-local
        types: deb
        uris: "{{ k8s_mirror_url }}"
        suites: "./"
        trusted: true
        state: present

    - name: Prepare system and install kubelet
      ansible.builtin.include_role:
        name: kubelet

    - name: Install CRI-O
      ansible.builtin.include_role:
        name: crio

    - name: Install kubeadm and kubectl
      ansible.builtin.include_role:
        name: kubeadm