---
argument_specs:
  main:
    short_description: Initialize Kubernetes master node and install Calico CNI.
    options:
      k8s_pod_network_cidr:
        type: str
        description: Pod network CIDR passed to kubeadm init. Must match the CNI plugin.
        default: "192.168.0.0/16"
      calico_manifest_url:
        type: str
        description: URL of the Calico manifest to apply after cluster initialization.
        default: "https://raw.githubusercontent.com/projectcalico/calico/v3.29.3/manifests/calico.yaml"