---
- name: Check if node already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Join worker node to cluster
  ansible.builtin.command:
    cmd: "{{ hostvars[groups['master'][0]]['kubeadm_join_command'] }} --cri-socket {{ cri_socket }}"
  when:
    - not kubelet_conf.stat.exists
    - kubeadm_join_command | length > 0
  register: join_result
  changed_when: "'This node has joined the cluster' in join_result.stdout"