---
argument_specs:
  main:
    short_description: Join a worker node to an existing Kubernetes cluster.
    options:
      kubeadm_join_command:
        type: str
        description: >
          Full kubeadm join command string generated by the master role.
          Typically passed via hostvars from the master node.
        default: ""
      cri_socket:
        type: str
        description: Path to the CRI socket on the worker node.
        default: "unix:///var/run/crio/crio.sock"