---
- name: Install CRI-O
  ansible.builtin.apt:
    name: cri-o
    state: present
    update_cache: true
  register: crio_install_result
  until: crio_install_result is succeeded
  retries: 3
  delay: 15

- name: Create CRI-O config directory
  ansible.builtin.file:
    path: /etc/crio/crio.conf.d
    state: directory
    mode: '0755'

- name: Configure CRI-O cgroup driver
  ansible.builtin.copy:
    content: |
      [crio.runtime]
      conmon_cgroup = "{{ crio_conmon_cgroup }}"
      cgroup_manager = "{{ crio_cgroup_driver }}"
    dest: /etc/crio/crio.conf.d/10-cgroup.conf
    mode: '0644'

- name: Configure CRI-O capabilities
  ansible.builtin.copy:
    content: |
      [crio.runtime]
      default_capabilities = [
          "CHOWN",
          "DAC_OVERRIDE",
          "FSETID",
          "FOWNER",
          "SETGID",
          "SETUID",
          "SETPCAP",
          "NET_BIND_SERVICE",
          "NET_RAW",
          "KILL",
      ]
    dest: /etc/crio/crio.conf.d/02-capabilities.conf
    mode: '0644'
  notify: restart crio

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start CRI-O
  ansible.builtin.systemd:
    name: crio
    enabled: true
    state: started
  when: not ansible_check_mode
