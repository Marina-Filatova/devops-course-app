- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name:
      - software-properties-common
      - curl
      - gpg
      - apt-transport-https
      - ca-certificates
    state: present
  register: crio_required_packages_result
  until: crio_required_packages_result is succeeded
  retries: 3
  delay: 10

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add CRI-O repository key
  ansible.builtin.get_url:
    url: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/cri-o-apt-keyring.asc
    mode: '0644'
  register: crio_repo_key_result
  until: crio_repo_key_result is succeeded
  retries: 3
  delay: 10

- name: Convert CRI-O key to gpg format
  ansible.builtin.shell: |
    cat /etc/apt/keyrings/cri-o-apt-keyring.asc | gpg --dearmor > /etc/apt/keyrings/cri-o-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/cri-o-apt-keyring.gpg
    executable: /bin/bash
  
- name: Add CRI-O repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_version }}/deb/ /"
    state: present
    filename: cri-o
    update_cache: yes

- name: Install CRI-O
  ansible.builtin.apt:
    name: cri-o
    state: present
  register: crio_install_result
  until: crio_install_result is succeeded
  retries: 3
  delay: 15

- name: Create CRI-O config directory
  ansible.builtin.file:
    path: /etc/crio/crio.conf.d
    state: directory
    mode: '0755'

- name: Configure CRI-O cgroup driver
  ansible.builtin.copy:
    content: |
      [crio.runtime]
      conmon_cgroup = "{{ crio_conmon_cgroup }}"
      cgroup_manager = "{{ crio_cgroup_driver }}"
    dest: /etc/crio/crio.conf.d/10-cgroup.conf
    mode: '0644'

- name: Enable and start CRI-O
  ansible.builtin.systemd:
    name: crio
    enabled: yes
    state: started
    daemon_reload: yes
