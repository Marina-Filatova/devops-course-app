---
- name: Prepare role for testing
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create role directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/roles"
        state: directory
        mode: '0755'

    - name: Copy crio role to scenario
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../roles/crio/"
        dest: "{{ playbook_dir }}/roles/crio/"
        mode: preserve