---
- name: Verify kubelet installation
  hosts: all
  become: true
  tasks:
    - name: Check if kubelet is installed
      ansible.builtin.command: which kubelet
      register: kubelet_check
      changed_when: false

    - name: Assert kubelet is installed
      ansible.builtin.assert:
        that:
          - kubelet_check.rc == 0

    - name: Check if kubelet service is enabled
      ansible.builtin.systemd:
        name: kubelet
      register: service_status

    - name: Assert kubelet service is enabled
      ansible.builtin.assert:
        that:
          - service_status.status.ActiveState in ['active', 'activating']

    - name: Check kernel modules
      ansible.builtin.shell: lsmod | grep -E "overlay|br_netfilter"
      register: modules_check
      changed_when: false

    - name: Assert kernel modules are loaded
      ansible.builtin.assert:
        that:
          - "'overlay' in modules_check.stdout"
          - "'br_netfilter' in modules_check.stdout"
