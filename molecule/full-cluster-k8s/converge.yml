---
- name: Initialize Kubernetes master node
  hosts: master
  become: true
  vars:
    k8s_pod_network_cidr: "192.168.0.0/16"
    calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/v3.29.3/manifests/calico.yaml"
  roles:
    - role: k8s_master
 
- name: Join worker nodes to cluster
  hosts: workers
  become: true
  vars:
    kubeadm_join_command: "{{ hostvars[groups['master'][0]]['kubeadm_join_command'] }}"
  roles:
    - role: k8s_worker
 