---
- name: Install mock kubeadm and kubectl on all nodes
  hosts: all
  become: true
  tasks:
    - name: Install mock kubeadm
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          if [[ "$*" == *"init"* ]]; then
            mkdir -p /etc/kubernetes
            cat > /etc/kubernetes/admin.conf <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
            - cluster:
                server: https://master-node:6443
              name: kubernetes
          contexts:
            - context:
                cluster: kubernetes
                user: kubernetes-admin
              name: kubernetes-admin@kubernetes
          current-context: kubernetes-admin@kubernetes
          users:
            - name: kubernetes-admin
              user: {}
          EOF
            exit 0
          fi
          if [[ "$*" == *"token create"* ]]; then
            echo "kubeadm join master-node:6443 --token abcdef.1234567890abcdef --discovery-token-ca-cert-hash sha256:aaabbbccc111222333"
            exit 0
          fi
          if [[ "$*" == *"join"* ]]; then
            mkdir -p /etc/kubernetes
            echo "# mock kubelet.conf" > /etc/kubernetes/kubelet.conf
            exit 0
          fi
          exit 0
        dest: /usr/local/bin/kubeadm
        mode: '0755'

    - name: Install mock kubectl
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          if [[ "$*" == *"cluster-info"* ]]; then
            echo "Kubernetes control plane is running at https://master-node:6443"
            exit 0
          fi
          if [[ "$*" == *"get nodes"* ]]; then
            echo "master-node   Ready    control-plane   10m   v1.32.13"
            echo "worker-node-1 Ready    <none>          5m    v1.32.13"
            exit 0
          fi
          if [[ "$*" == *"apply"* ]]; then
            echo "created"
            exit 0
          fi
          exit 0
        dest: /usr/local/bin/kubectl
        mode: '0755'