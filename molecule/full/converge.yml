---
- name: Full Kubernetes installation test
  hosts: all
  become: true
  vars:
    kubernetes_version: "1.32"
    crio_version: "1.32"
    k8s_mirror_url: "http://10.183.0.17:8080"
  tasks:
    - name: Remove conflicting repo files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/kubernetes.list
        - /etc/apt/sources.list.d/kubernetes.sources
        - /etc/apt/sources.list.d/cri-o.list
        - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - /etc/apt/keyrings/kubernetes.asc
        - /etc/apt/keyrings/crio-apt-keyring.gpg
        
    - name: Install python3-debian
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: true

    - name: Add local mirror repository
      ansible.builtin.deb822_repository:
        name: k8s-local
        types: deb
        uris: "{{ k8s_mirror_url }}"
        suites: "./"
        trusted: true
        state: present

    - name: Prepare system and install kubelet
      ansible.builtin.include_role:
        name: kubelet

    - name: Install CRI-O container runtime
      ansible.builtin.include_role:
        name: crio

    - name: Add Kubernetes repository and install kubeadm/kubectl
      ansible.builtin.include_role:
        name: kubeadm