---
- name: Verify full Kubernetes installation
  hosts: all
  become: true
  tasks:
    - name: Check CRI-O installed
      ansible.builtin.command: which crio
      register: crio_check
      changed_when: false
      failed_when: false

    - name: Assert CRI-O installed
      ansible.builtin.assert:
        that:
          - crio_check.rc == 0
        fail_msg: "CRI-O is NOT installed"
        success_msg: "CRI-O is installed"

    - name: Check kubeadm installed
      ansible.builtin.command: which kubeadm
      register: kubeadm_check
      changed_when: false
      failed_when: false

    - name: Assert kubeadm installed
      ansible.builtin.assert:
        that:
          - kubeadm_check.rc == 0
        fail_msg: "kubeadm is NOT installed"
        success_msg: "kubeadm is installed"

    - name: Check kubelet installed
      ansible.builtin.command: which kubelet
      register: kubelet_check
      changed_when: false
      failed_when: false

    - name: Assert kubelet installed
      ansible.builtin.assert:
        that:
          - kubelet_check.rc == 0
        fail_msg: "kubelet is NOT installed"
        success_msg: "kubelet is installed"

    - name: Check kubectl installed
      ansible.builtin.command: which kubectl
      register: kubectl_check
      changed_when: false
      failed_when: false

    - name: Assert kubectl installed
      ansible.builtin.assert:
        that:
          - kubectl_check.rc == 0
        fail_msg: "kubectl is NOT installed"
        success_msg: "kubectl is installed"

    - name: Get installed versions
      ansible.builtin.shell: |
        echo "=== CRI-O ===" && crio --version 2>/dev/null | head -1 || echo "not found"
        echo "=== kubeadm ===" && kubeadm version 2>/dev/null || echo "not found"
        echo "=== kubelet ===" && kubelet --version 2>/dev/null || echo "not found"
        echo "=== kubectl ===" && kubectl version --client 2>/dev/null || echo "not found"
      register: versions
      changed_when: false
      failed_when: false

    - name: Show installed versions
      ansible.builtin.debug:
        var: versions.stdout_lines

    - name: Check kernel modules loaded
      ansible.builtin.shell: lsmod | grep -E "overlay|br_netfilter"
      register: modules
      changed_when: false
      failed_when: false

    - name: Assert kernel modules loaded
      ansible.builtin.assert:
        that:
          - "'overlay' in modules.stdout"
          - "'br_netfilter' in modules.stdout"
        fail_msg: "Required kernel modules NOT loaded"
        success_msg: "Required kernel modules loaded"

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "CRI-O: installed"
          - "kubeadm: installed"
          - "kubelet: installed"
          - "kubectl: installed"
          - "Kernel modules: loaded"